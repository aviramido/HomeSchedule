<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Schedule</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f2f5f9; margin: 0; padding: 1rem; color: #222; }
  .wrap { max-width: 90%; margin: 0 auto; }
  header { text-align: center; margin-bottom: 2rem; }
  #date { font-size: 1.6rem; }
  #time { font-size: 1.6rem; font-weight: 600; text-align: center; }
  #letter { display: inline-block; margin-top: .5rem; font-size: 2.5rem; padding: .4rem 1.2rem; border-radius: 2rem; background: #2d6cdf; color: #fff; }
  #letter.none { background: #888; }
  #howToGetHome { display: inline-block; margin-top: .5rem; font-size: 2.5rem; padding: .4rem 1.2rem; border-radius: 2rem; background: #2d6cdf; color: #fff; }
  #lunch {display: inline-block; margin-top: .5rem; font-size: 1.5rem; padding: .4rem 1.2rem; border-radius: 2rem; background: #9f9fa0; color: #000;  }
  #lunch h2 { display: inline; margin: 0 .35rem 0 0; font-size: inherit; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; font-size: 3rem; }
  .card { background: #fff; border-radius: 12px; padding: 1rem 1.5rem; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
  .card h2 { margin-top: 0; }
  .activity-icon { margin-right: .35em; }
  .empty { color: #888; }
  #future-heading { font-size: 2rem; margin-top:3rem;margin-bottom: 0.5rem; color:#555;}
  /*.future-cards, .future-cards .card h2, .future-cards .card h3 { font-size: 1.3rem; font-weight: 400; margin:0; color:#555;}*/
  .future-cards .card{
    color:#555;
  } 
  .future-cards .card h2{ font-size: 1.3rem; font-weight: 600; }
  .future-cards .card h3{ font-size: 1.3rem; font-weight: 400; margin:0; margin-top:1rem;}
  .future-cards .card ul{ font-size: 1.3rem; font-weight: 400; margin:0; }
  .future-cards .card .empty { font-size: 3rem;color: #00840b; }
  .futureLunch { font-size: 0.8rem; line-height: 0.8rem; }
  .reminder { color: #c70000ca; font-size:80%; margin-left: .5rem; font-weight: 600; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <span id="letter" class="none">Loading…</span>
      <span id="version">(2.4)</span>
      <span id="howToGetHome"></span>
      <div><span id="date"></span> - <span id="time"></span></div>
      <div id="lunch"></div>
    </div>
    
  </header>
  <div class="cards" id="cards"></div>
  <section aria-labelledby="future-heading">
    <h2 id="future-heading">Next 4 Days</h2>
    <div class="cards future-cards" id="future-cards"></div>
  </section>
</div>

<script>
// Local copy; at publish time, replace with a server-side refresh of the remote calendar (remote lacks CORS headers).
//const FETCH_URLS = ["calendar.ics"];
const FETCH_URLS = ["calendar.ics","https://bmprss.blindbrook.org/fs/calendar-manager/events.ics?calendar_ids=4"];


let schedule = null;
let letter = null;
let calendar = null;

function ymd(d) {
  return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
}

function tick() {
  const now = new Date();
  document.getElementById("date").textContent =
    now.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  document.getElementById("time").textContent = now.toLocaleTimeString();
}

async function fetchText(urls) {
  for (const u of urls) {
    try {
      const r = await fetch(u);
      if (r.ok) return await r.text();
    } catch (e) { /* try next */ }
  }
  throw new Error("Could not load calendar");
}

function findLetter(ics, today) {
  const text = ics.replace(/\r?\n[ \t]/g, "");
  for (const block of text.split("BEGIN:VEVENT").slice(1)) {
    const start = /DTSTART[^:]*:(\d{8})/.exec(block);
    const summary = /SUMMARY:(.*)/.exec(block);
    if (start && summary && start[1] === today) {
      const m = /\b([A-F])\b/i.exec(summary[1].trim());
      if (m) return m[1].toUpperCase();
    }
  }
  return null;
}

function iconForActivity(activity) {
  if (/^PE\b/i.test(activity)) return "⚽";
  const icons = {
    "library": "📚",
    "espanol": "🇪🇸",
    "art": "🎨",
    "music": "🎵",
    "band": "🎺",
    "computer": "💻",
    "young engineers": "🤖",
    "ot push in": "🧩",
    "gymnastics": "🤸‍♂️",
    "soccer": "⚽"
  };
  return icons[activity.trim().toLowerCase()] || "📌";
}

function renderLunch() {
  const lunch = document.getElementById("lunch");
  const today = new Date();
  const todayMenu = getLunchForDate(today);
  lunch.replaceChildren();
  const heading = document.createElement("h2");
  heading.textContent = "Lunch:";
  lunch.appendChild(heading);
  
  lunch.appendChild(document.createTextNode(todayMenu));
}

function getLunchForDate(date) {
  if (!g_LunchData) return null;
  if (!date) return null;
  const dk = [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0")
  ].join("-");
  const todayMenu = g_LunchData.menu.find(item => item.date === dk);
  let toReturn = "";
  if (!todayMenu) {
    if (date.getDay() === 0 || date.getDay() === 6) {
      toReturn = "No school today";
    } else {
      toReturn = "Lunch data might need to be updated";
    }
    return toReturn;
  }
  if (!todayMenu.school_open) {
    return null;
  }

  const details = [todayMenu.main_entree, ...(todayMenu.sides || [])].filter(Boolean);
  if (todayMenu.side_options && todayMenu.side_options.length) {
    details.push(todayMenu.side_options.join(", "));
  }
  if (todayMenu.milk) details.push(todayMenu.milk);
  toReturn += (details.join(" · ") || "Menu not listed.");
  return toReturn;
}

function render() {
  const el = document.getElementById("letter");
  el.textContent = letter ? "Day " + letter : "No letter day today";
  el.className = letter ? "" : "none";
  const cards = document.getElementById("cards");
  cards.innerHTML = "";
  if (!schedule) return;
  const today = (new Date()).getDay();
  document.getElementById("howToGetHome").textContent =
    (today===0 || today===6 ? "🎉 No School 🎉" : (today===2 || today===3 || today===4 ? "🛝 Stay in Rye Rec 🛝" : "🚌 Come home on the Bus 🚌"));
  for (const [name, days] of Object.entries(schedule)) {
    const card = document.createElement("div");
    card.className = "card";
    const h = document.createElement("h2");
    h.textContent = name;
    if (letter != null && ((name.toLocaleLowerCase() == "romy" && letter.toLocaleLowerCase() == "d"))){
      const reminder = document.createElement("span");
      reminder.className = "reminder";
      reminder.textContent = " - FLUTE";
      h.appendChild(reminder);
    }
    if ((name.toLocaleLowerCase() == "zoey" && today===5)){
      const reminder = document.createElement("span");
      reminder.className = "reminder";
      reminder.textContent = " - Homework Sheet";
      h.appendChild(reminder);
    }

    card.appendChild(h);
    const items = letter ? (days[letter] || []) : [];
    if (items.length) {
      const ul = document.createElement("ul");
      items.forEach(a => {
        const li = document.createElement("li");
        const icon = iconForActivity(a);
        if (icon) {
          const iconEl = document.createElement("span");
          iconEl.className = "activity-icon";
          iconEl.setAttribute("aria-hidden", "true");
          iconEl.textContent = icon;
          li.appendChild(iconEl);
        }
        li.appendChild(document.createTextNode(a));
        ul.appendChild(li);
      });
      card.appendChild(ul);
    } else {
      if ((name.toLocaleLowerCase() == "romy" || name.toLocaleLowerCase() == "zoey") && today===0){
        const ul = document.createElement("ul");
        const li = document.createElement("li");
        const icon = iconForActivity("gymnastics");
        if (icon) {
          const iconEl = document.createElement("span");
          iconEl.className = "activity-icon";
          iconEl.setAttribute("aria-hidden", "true");
          iconEl.textContent = icon;
          li.appendChild(iconEl);
        }
        li.appendChild(document.createTextNode("Gymnastics"));
        ul.appendChild(li);
        card.appendChild(ul);
      } else if (name.toLocaleLowerCase() == "zoey" && today===6){
          const ul = document.createElement("ul");
          const li = document.createElement("li");
          const icon = iconForActivity("soccer");
          if (icon) {
            const iconEl = document.createElement("span");
            iconEl.className = "activity-icon";
            iconEl.setAttribute("aria-hidden", "true");
            iconEl.textContent = icon;
            li.appendChild(iconEl);
          }
          li.appendChild(document.createTextNode("Soccer"));
          ul.appendChild(li);
          card.appendChild(ul);
      } else {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "🎉No activities today.🎉";
        card.appendChild(p);
      }
    }
    cards.appendChild(card);
  }

  const futureCards = document.getElementById("future-cards");
  futureCards.innerHTML = "";
  const date = new Date();
  let futureDays = 0;
  while (futureDays < 4) {
    date.setDate(date.getDate() + 1);
    if (date.getDay() === 0 || date.getDay() === 6) continue;
    futureDays++;

    const dateKey = ymd(date);
    const futureLetter = findLetter(calendar, dateKey);
    const card = document.createElement("div");
    card.className = "card";
    const heading = document.createElement("h2");
    heading.textContent = date.toLocaleDateString(undefined, {
      weekday: "long",
      month: "long",
      day: "numeric"
    }) + (futureLetter ? " — Day " + futureLetter : "");
    card.appendChild(heading);
    const lunchForDay = getLunchForDate(date);
    if (lunchForDay) {
      const lunchEl = document.createElement("p");
      lunchEl.className = "futureLunch";
      lunchEl.textContent = "🍽️ " + lunchForDay;
      card.appendChild(lunchEl);
    }

    if (futureLetter) {
      for (const [name, days] of Object.entries(schedule)) {
        const person = document.createElement("h3");
        person.textContent = name;
        card.appendChild(person);
        const items = days[futureLetter] || [];
        if (items.length) {
          const ul = document.createElement("ul");
          items.forEach(activity => {
            const li = document.createElement("li");
            const icon = iconForActivity(activity);
            const iconEl = document.createElement("span");
            iconEl.className = "activity-icon";
            iconEl.setAttribute("aria-hidden", "true");
            iconEl.textContent = icon;
            li.appendChild(iconEl);
            li.appendChild(document.createTextNode(activity));
            ul.appendChild(li);
          });
          card.appendChild(ul);
        } else {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "No activities.";
          card.appendChild(empty);
        }
      }
    } else {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "🎉 No school";
      card.appendChild(empty);
    }
    futureCards.appendChild(card);
  }
}

let g_LunchData = null;

async function init() {
  tick();
  setInterval(tick, 1000);
  try {
    g_LunchData = await (await fetch("lunch.json")).json();
    renderLunch(g_LunchData);
  } catch (e) {
    document.getElementById("lunch").textContent = "Could not load lunch.json.";
  }
  try {
    schedule = await (await fetch("schedule.json")).json();
  } catch (e) {
    document.getElementById("cards").textContent =
      "Could not load schedule.json (serve this folder over http, e.g. 'python -m http.server').";
  }
  try {
    calendar = await fetchText(FETCH_URLS);
    letter = findLetter(calendar, ymd(new Date()));
  } catch (e) {
    document.getElementById("letter").textContent = "Calendar unavailable";
    return;
  }
  render();
}
init();
</script>
</body>
</html>
